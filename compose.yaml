services:
  bot:
    build:
      context: .
    image: media-embedder-bot:latest
    restart: unless-stopped
    init: true
    env_file:
      - .env
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
